/* Scoped, minimal flex layout. Prefix classes to avoid collisions. */
.sf {               /* main vertical container */
  display: flex;
  flex-direction: column;
  /* gap: 16px; */
  gap: 30px;
  width: 100%;
}

.sf__row {          /* each vertical child (row) */
  display: flex;                 /* horizontal layout inside each row */
  justify-content: space-between;/* left item to far left, right item to far right */
  /* align-items: center; */
  /* align-items: flex-start; */
  align-items: stretch;
  margin: 0px;                /* margin is outside the filled width */
  width: calc(100%);      /* fill width not including horizontal margin */
}

.sf__left {         /* left area: two text items stacked vertically */
  display: flex;
  /* height:100%; */
  width:auto;
  flex-direction: column;
  justify-content: space-between;
  flex: 1 1 auto;
  /* justify-content: flex-start; */
  /* align-items: flex-start;  */
  gap: 4px;
  min-width: 0;   /* prevents overflow/truncation issues */
  min-height: 0;  /* allows inner elements to shrink if needed */
}

/* KEY PART - container driven by image size */
.sf__right {
  display: flex;
  height:35vh;       /* fixed height you requested */
  aspect-ratio: 8000 / 3238;
  justify-content: flex-end;
  /* width: calc(height/(8000px/3238px)); */
  /* flex: 0 0 auto; */
      /* do NOT grow or shrink; size follows content */

  /* display:inline-flex; */
  /* optional: keeps the container sized to content */
 
}

/* image fills container height, width determined by aspect ratio */
.sf__right img {
  display:block;
  height:100%;
  width:auto;
  /* object-fit not needed (we don't want cropping) */
}
.sf__title {  font-family: 'Roboto'; font-stretch: 10%;   line-height: 1; margin-top: -0.08em; font-size: 60px; font-weight: 600; letter-spacing: -0px;}
.sf__subtitle { font-family: 'Roboto'; font-size: 27px; }
.sf__tags { font-family: 'Roboto'; font-size: 20px; font-weight: 400;}

</style>

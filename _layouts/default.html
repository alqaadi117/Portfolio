<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  <!-- dont touch the head -->
  {%- include head.html -%}

  <body>
    <!-- header displays stuff in header -->
    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    <!-- footer is everthing after the page, you should definitly modify this -->
    {%- include footer.html -%} 

  </body>

</html>

<!-- _includes/header.html -->
<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
      {% else %}
        <span class="site-title">{{ site.title }}</span>
      {% endif %}
    </a>

    <nav class="nav" role="navigation" aria-label="Main navigation">
      <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
      <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
      <a class="nav-link" href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
    </nav>
  </div>
</header>

<style>
  :root {
    --bg: #000;
    --muted: #d4d4d4;
    --text: #fff;
    --gap: 1rem;
  }

  .site-header {
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.6rem 1rem;
    display: flex;
    align-items: center;
    gap: var(--gap);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: .6rem;
    text-decoration: none;
    color: inherit;
  }

  .brand img {
    height: 48px;
    width: auto;
    display: block;
  }

  .site-title {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: .02em;
  }

  /* Nav (tabs) */
  .nav {
    margin-left: auto;            /* pushes nav to the right */
    display: flex;
    gap: .4rem;
    align-items: center;
  }

  .nav-link {
    display: inline-block;
    padding: .45rem .7rem;
    border-radius: 8px;
    text-decoration: none;
    color: var(--muted);
    font-weight: 600;
    font-size: .95rem;
    transition: background .12s ease, color .12s ease;
  }

  .nav-link:hover,
  .nav-link:focus {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    outline: none;
  }

  /* Responsive: stack on small screens */
  @media (max-width: 640px) {
    .container { flex-direction: column; align-items: stretch; gap: .5rem; }
    .brand { padding: .2rem 0; }
    .nav { margin-left: 0; justify-content: flex-start; flex-wrap: wrap; gap: .35rem; }
    .brand img { height: 40px; }
  }
</style>
